<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unique IT - Connect With Us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Poppins', 'Hind Siliguri', sans-serif;
      background: linear-gradient(145deg, #090d16 0%, #111827 50%, #0f172a 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .container {
      width: 100%;
      max-width: 420px;
      background: rgba(30, 41, 59, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 28px;
      padding: 36px 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .avatar-wrapper {
      position: relative;
      margin-bottom: 18px;
    }
    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 700;
      color: #ffffff;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
      border: 3px solid rgba(255, 255, 255, 0.2);
    }
    .status-dot {
      width: 16px;
      height: 16px;
      background: #22c55e;
      border: 2px solid #0f172a;
      border-radius: 50%;
      position: absolute;
      bottom: 2px;
      right: 4px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }
    p.subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .links-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }
    .btn-link {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      border-radius: 18px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-link:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.3);
    }
    .btn-link:active {
      transform: translateY(0);
    }
    .btn-fb {
      background: linear-gradient(135deg, #0866FF 0%, #0052cc 100%);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(8, 102, 255, 0.35);
    }
    .btn-fb:hover {
      box-shadow: 0 12px 28px rgba(8, 102, 255, 0.5);
    }
    .btn-wa {
      background: linear-gradient(135deg, #25D366 0%, #1eaf52 100%);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(37, 211, 102, 0.35);
    }
    .btn-wa:hover {
      box-shadow: 0 12px 28px rgba(37, 211, 102, 0.5);
    }
    .icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .icon svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }
    .text-content {
      text-align: left;
      flex: 1;
    }
    .text-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
    }
    .text-sub {
      font-size: 12px;
      opacity: 0.85;
      font-weight: 400;
    }
    .arrow-icon {
      width: 18px;
      height: 18px;
      opacity: 0.8;
      transition: transform 0.2s;
    }
    .btn-link:hover .arrow-icon {
      transform: translateX(4px);
      opacity: 1;
    }
    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #64748b;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="avatar-wrapper">
      <div class="avatar">U</div>
      <div class="status-dot"></div>
    </div>
    
    <h1>Unique IT</h1>
    <p class="subtitle">আমাদের সাথে যুক্ত হতে যেকোনো একটি মাধ্যমে ক্লিক করুন</p>

    <div class="links-list">
      <!-- Facebook Button -->
      <a href="https://www.facebook.com/share/1JM3a5LaEK/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer" class="btn-link btn-fb">
        <div class="icon">
          <svg viewBox="0 0 24 24">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
        </div>
        <div class="text-content">
          <div class="text-title">Facebook Page</div>
          <div class="text-sub">পেজ ফলো ও মেসেজ করুন</div>
        </div>
        <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </a>

      <!-- WhatsApp Button -->
      <a href="https://wa.me/message/6SJXUJQS4BVCD1" target="_blank" rel="noopener noreferrer" class="btn-link btn-wa">
        <div class="icon">
          <svg viewBox="0 0 24 24">
            <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
          </svg>
        </div>
        <div class="text-content">
          <div class="text-title">WhatsApp Direct</div>
          <div class="text-sub">সরাসরি হোয়াটসঅ্যাপে চ্যাট করুন</div>
        </div>
        <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </a>
    </div>

    <div class="footer">
      Powered by Unique IT &bull; All Rights Reserved
    </div>
  </div>

</body>
</html>
