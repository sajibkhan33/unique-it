<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <!-- Pure White Background -->
  <rect width="1000" height="1000" fill="#FFFFFF"/>

  <!-- Definitions & Gradients -->
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052FF"/>
      <stop offset="100%" stop-color="#0038B8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0052FF"/>
    </linearGradient>
  </defs>

  <g transform="translate(0, -20)">
    <!-- Monogram U & I (Golden Ratio Geometric Fusion) -->
    <!-- U-Shape Bold Continuous Geometry -->
    <g transform="translate(500, 420)">
      <!-- Left Stem of U -->
      <path d="M -140 -160 
               L -80 -160 
               L -80 0 
               C -80 66 -26 120 40 120 
               C 106 120 160 66 160 0 
               L 160 -160 
               L 220 -160 
               L 220 0 
               C 220 100 139 180 40 180 
               C -59 180 -140 100 -140 0 
               Z" 
            fill="url(#primaryGrad)"/>

      <!-- Integrated 'I' Pillar with Precision Gap (Negative Space) -->
      <!-- Center Stem of I passing through or rising -->
      <path d="M 10 -160 
               L 70 -160 
               L 70 50 
               L 10 50 
               Z" 
            fill="url(#accentGrad)"/>

      <!-- Modern Cyber Sensor Dot for 'I' -->
      <rect x="10" y="-230" width="60" height="50" rx="12" fill="#00D2FF"/>
    </g>

    <!-- Corporate Typography: UNIQUE IT -->
    <text x="500" y="700" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', Helvetica, Arial, sans-serif" 
          font-size="64" 
          font-weight="800" 
          letter-spacing="14" 
          fill="#0F172A" 
          text-anchor="middle">
      UNIQUE IT
    </text>

    <!-- Subtitle / Tagline -->
    <text x="500" y="745" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', Helvetica, Arial, sans-serif" 
          font-size="16" 
          font-weight="600" 
          letter-spacing="8" 
          fill="#64748B" 
          text-anchor="middle">
      NEXT-GEN TECHNOLOGY
    </text>
  </g>
</svg>
