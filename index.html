<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unique IT - Official Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 50%, #020617 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 40px 24px 32px;
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.05);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.6s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .avatar-wrapper {
      position: relative;
      margin-bottom: 20px;
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 800;
      color: #ffffff;
      box-shadow: 0 12px 30px rgba(37, 99, 235, 0.45);
      border: 3px solid rgba(255, 255, 255, 0.25);
    }
    .status-badge {
      width: 18px;
      height: 18px;
      background: #22c55e;
      border: 3px solid #0f172a;
      border-radius: 50%;
      position: absolute;
      bottom: 2px;
      right: 4px;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    .tagline {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }
    .link-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .link-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.4);
    }
    .link-btn:active {
      transform: translateY(0);
    }
    .link-fb {
      background: linear-gradient(135deg, #0866FF 0%, #0052cc 100%);
      color: #ffffff;
      box-shadow: 0 8px 24px rgba(8, 102, 255, 0.35);
    }
    .link-fb:hover {
      box-shadow: 0 14px 32px rgba(8, 102, 255, 0.55);
    }
    .link-wa {
      background: linear-gradient(135deg, #25D366 0%, #1eaf52 100%);
      color: #ffffff;
      box-shadow: 0 8px 24px rgba(37, 211, 102, 0.35);
    }
    .link-wa:hover {
      box-shadow: 0 14px 32px rgba(37, 211, 102, 0.55);
    }
    .icon-box {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .icon-box svg {
      width: 24px;
      height: 24px;
      fill: #ffffff;
    }
    .text-box {
      text-align: left;
      flex: 1;
    }
    .btn-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
    }
    .btn-desc {
      font-size: 12px;
      opacity: 0.9;
      font-weight: 400;
      margin-top: 2px;
    }
    .arrow-icon {
      width: 20px;
      height: 20px;
      opacity: 0.75;
      transition: transform 0.2s;
    }
    .link-btn:hover .arrow-icon {
      transform: translateX(4px);
      opacity: 1;
    }
    .footer {
      margin-top: 36px;
      font-size: 12px;
      color: #64748b;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar-wrapper">
      <div class="avatar">U</div>
      <div class="status-badge" title="Online"></div>
    </div>
    
    <h1>Unique IT</h1>
    <p class="tagline">Select your preferred platform to connect with us</p>

    <div class="links">
      <!-- Facebook Button -->
      <a href="https://www.facebook.com/share/1JM3a5LaEK/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer" class="link-btn link-fb">

          </svg>

        <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>

      <!-- WhatsApp Button -->

          </svg>
        </div>
        <div class="text-box">
          <div class="btn-title">WhatsApp Chat</div>
          <div class="btn-desc">Chat directly with our team</div>
        </div>
        <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </a>
    </div>

    <div class="footer">
      &copy; Unique IT &bull; All Rights Reserved
    </div>
  </div>

</body>
</html>
