<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Unique IT • Official Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030712;
      --card-bg: rgba(17, 24, 39, 0.75);
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.2);
      --text: #f9fafb;
      --text-muted: #94a3b8;
      --fb-blue: #1877F2;
      --wa-green: #25D366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 24px) 18px env(safe-area-inset-bottom, 20px);
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Background Glow */
    .glow-bg {
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 400px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.18) 0%, rgba(16, 185, 129, 0.08) 50%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    .main-wrapper {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
      margin: auto 0;
    }

    /* Profile Header */
    .profile-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 28px;
    }

    .avatar-ring {
      position: relative;
      padding: 3px;
      background: linear-gradient(135deg, #38bdf8, #2563eb 50%, #10b981);
      border-radius: 50%;
      margin-bottom: 14px;
      box-shadow: 0 10px 28px -6px rgba(37, 99, 235, 0.4);
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #0b0f19;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -1px;
    }

    .status-indicator {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 14px;
      height: 14px;
      background: #22c55e;
      border: 2.5px solid #030712;
      border-radius: 50%;
    }

    .status-indicator::after {
      content: '';
      position: absolute;
      top: -2.5px;
      left: -2.5px;
      right: -2.5px;
      bottom: -2.5px;
      border-radius: 50%;
      background: #22c55e;
      opacity: 0.6;
      animation: pulse 2s infinite ease-out;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: #ffffff;
    }

    .verified-badge {
      width: 18px;
      height: 18px;
      fill: #38bdf8;
    }

    .bio-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 100px;
      font-size: 12px;
      font-weight: 500;
      color: #94a3b8;
    }

    .online-dot {
      width: 6px;
      height: 6px;
      background: #22c55e;
      border-radius: 50%;
    }

    /* Slim-fit Action Buttons */
    .links-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-card {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 20px;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      background: var(--card-bg);
      border: 1px solid var(--border);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .link-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.06), transparent);
      transition: left 0.6s ease;
    }

    .link-card:active {
      transform: scale(0.975);
    }

    .link-card:hover::before {
      left: 140%;
    }

    /* Facebook Card Styling */
    .link-card.facebook {
      background: linear-gradient(135deg, rgba(24, 119, 242, 0.12) 0%, rgba(17, 24, 39, 0.8) 100%);
      border-color: rgba(24, 119, 242, 0.35);
    }

    .link-card.facebook:hover {
      border-color: rgba(24, 119, 242, 0.7);
      box-shadow: 0 8px 24px -6px rgba(24, 119, 242, 0.35);
    }

    .icon-box.fb {
      background: #1877F2;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(24, 119, 242, 0.45);
    }

    /* WhatsApp Card Styling */
    .link-card.whatsapp {
      background: linear-gradient(135deg, rgba(37, 211, 102, 0.12) 0%, rgba(17, 24, 39, 0.8) 100%);
      border-color: rgba(37, 211, 102, 0.35);
    }

    .link-card.whatsapp:hover {
      border-color: rgba(37, 211, 102, 0.7);
      box-shadow: 0 8px 24px -6px rgba(37, 211, 102, 0.35);
    }

    .icon-box.wa {
      background: #25D366;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.45);
    }

    .icon-box {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-box svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
    }

    .text-area {
      flex: 1;
      text-align: left;
      min-width: 0;
    }

    .text-title {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.25;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-subtle {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
      font-weight: 600;
    }

    .text-sub {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 500;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .arrow-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #94a3b8;
      transition: all 0.2s ease;
    }

    .link-card:hover .arrow-btn {
      background: #ffffff;
      color: #000000;
      transform: translateX(2px);
    }

    .arrow-btn svg {
      width: 14px;
      height: 14px;
    }

    /* Footer */
    footer {
      width: 100%;
      text-align: center;
      padding-top: 24px;
      position: relative;
      z-index: 1;
    }

    .footer-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

    </div>
  </div>

  <!-- Minimal Footer -->
  <footer>
    <div class="footer-pill">
      Unique IT &bull; All Rights Reserved
    </div>
  </footer>

</body>
</html>
